services:
  v2x-viewer:
    build:
      context: .
      dockerfile: docker/viewer/Dockerfile
    ports:
      - "${V2X_VIEWER_PORT:-8080}:8080"
    environment:
      V2X_PLY: "${V2X_PLY:-/workspace/vggt-transformer-pipeline/runs/v2x-real-mid/scene.ply}"
      V2X_DATASET: "${V2X_DATASET:-/workspace/vggt-transformer-pipeline/runs/v2x-real-mid/prepared}"
    volumes:
      - .:/workspace:ro
    restart: unless-stopped

